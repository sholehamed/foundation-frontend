name: Frontend BFF safety CI

on:
  pull_request:
    paths:
      - '.github/workflows/frontend-bff-ci.yml'
      - 'src/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontend-bff-ci.yml'
      - 'src/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'

permissions:
  contents: read

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm run test:unit
      - name: Development build
        run: npm run build -- --configuration development
